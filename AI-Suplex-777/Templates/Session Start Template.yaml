---
Activation_Phrase: "AI-Suplex: Session Start"
Parameters_Required:
  - Session_Type: [planning, execution, review, creative, analytical]
  - Mission: "One sentence describing what you will achieve"
  - Expected_Duration: "Time estimate (e.g., 90 minutes)"
  - Energy_Level: "⚡1 to ⚡5 (1=exhausted, 5=hyperfocused)"
  - Tasks:
      - "Task 1 (verb first)"
      - "Task 2"
      - "Task 3"
  - Success_Metrics:
      - "Metric 1 (concrete, verifiable)"
      - "Metric 2"
Response_Protocol:
  - "Create a session start file in AI-Suplex/Sessions/Active/Start/"
  - "Include frontmatter with date, time, energy level"
  - "List tasks as checkboxes"
  - "List success metrics as bullet points"
  - "Open the file for editing"
Example:
  Activation_Phrase: "AI-Suplex: Session Start"
  Session_Type: execution
  Mission: "Wire the daily brief to the team chat gateway"
  Expected_Duration: "90 minutes"
  Energy_Level: ⚡⚡⚡⚡
  Tasks:
    - "Confirm the gateway credentials"
    - "Send a test brief"
    - "Schedule the cron"
  Success_Metrics:
    - "Test brief received"
    - "Cron scheduled"
---